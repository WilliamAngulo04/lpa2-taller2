services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: factura-api
    ports:
      - "8000:8000"
    networks:
      - factura-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: factura-frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_API_URL=http://backend:8000
      - DEBUG=false
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - factura-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:

  factura-network:
    driver: bridge
