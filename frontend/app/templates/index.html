<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Facturas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Generador de Facturas PDF</h1>
        <form id="form-factura" method="POST" action="{{ url_for('generar_pdf') }}" target="_blank">
            <div class="form-group">
                <label for="id_factura">ID de Factura:</label>
                <input type="text" id="id_factura" name="id_factura" placeholder="Ej: FAC-2025-001" required>
            </div>
            <button type="submit" id="btn-generar">Generar Factura</button>
        </form>

        <div id="alerta" class="alert" hidden></div>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="alert">
                    {% for message in messages %}
                        <p>{{ message }}</p>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}
    </div>

    <div id="vista-previa" class="container preview" hidden>
        <div class="preview-header">
            <h2 id="preview-titulo">Vista previa</h2>
            <div class="preview-actions">
                <a id="btn-descargar" class="btn" href="#" download>Descargar PDF</a>
                <button type="button" id="btn-imprimir" class="btn btn-secondary">Imprimir</button>
            </div>
        </div>
        <iframe id="pdf-frame" title="Vista previa de la factura"></iframe>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
